<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PowderBox logo</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:40px;background:#f4f7fa;font-family:Rubik,system-ui,sans-serif;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
  <div id="mark-dark" style="width:128px;height:128px;border-radius:28px;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font:600 54px Rubik,sans-serif;letter-spacing:-.04em">pb<span style="color:#ffd9b0">*</span></div>
  <div id="mark-warm" style="width:128px;height:128px;border-radius:28px;background:#ffd9b0;color:#1b2a4a;display:flex;align-items:center;justify-content:center;font:600 54px Rubik,sans-serif;letter-spacing:-.04em">pb*</div>
  <div id="mark-round" style="width:128px;height:128px;border-radius:50%;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font:600 54px Rubik,sans-serif;letter-spacing:-.04em">pb<span style="color:#ffd9b0">*</span></div>
  <div id="mark-plain" style="width:128px;height:128px;display:flex;align-items:center;justify-content:center;font:600 54px Rubik,sans-serif;letter-spacing:-.04em;color:#132030">pb<span style="color:#e0a763">*</span></div>
</div>
<div style="display:flex"><div id="wordmark-dark" style="background:#fff;padding:28px 32px;border-radius:12px;font:600 46px Rubik,sans-serif;letter-spacing:-.03em;color:#132030">powderbox<span style="color:#e0a763">*</span></div></div>
<div style="display:flex"><div id="wordmark-light" style="background:#1b2a4a;padding:28px 32px;border-radius:12px;font:600 46px Rubik,sans-serif;letter-spacing:-.03em;color:#fff">powderbox<span style="color:#ffd9b0">*</span></div></div>
<div style="display:flex"><div id="lockup" style="background:#fff;padding:24px 32px;border-radius:12px;display:flex;align-items:center;gap:22px">
  <span style="width:96px;height:96px;border-radius:22px;background:#1b2a4a;color:#fff;display:flex;align-items:center;justify-content:center;font:600 40px Rubik,sans-serif;letter-spacing:-.04em">pb<span style="color:#ffd9b0">*</span></span>
  <span style="font:600 42px Rubik,sans-serif;letter-spacing:-.03em;color:#132030">powderbox<span style="color:#e0a763">*</span></span>
</div></div>
</body></html>
